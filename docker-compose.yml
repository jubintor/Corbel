services:
  corbel-db:
    image: postgres:16-alpine
    container_name: corbel-db
    environment:
      POSTGRES_USER: corbel
      POSTGRES_PASSWORD: corbel_secret_password
      POSTGRES_DB: corbel_db
    ports:
      - "5432:5432"
      - "5433:5432"
    volumes:
      - corbel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corbel -d corbel_db"]
      interval: 3s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  corbel-backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: corbel-backend
    depends_on:
      corbel-db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      APP_NAME: Corbel
      APP_VERSION: "0.1.0"
      HOST: 0.0.0.0
      PORT: 8000
      POSTGRES_SERVER: corbel-db
      POSTGRES_PORT: 5432
      POSTGRES_USER: corbel
      POSTGRES_PASSWORD: corbel_secret_password
      POSTGRES_DB: corbel_db
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:3000","http://127.0.0.1:3000"]'
    volumes:
      - ./src:/app/src
      - ./alembic:/app/alembic
      - ./tests:/app/tests
      - ./pyproject.toml:/app/pyproject.toml
    restart: unless-stopped

  corbel-frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: corbel-frontend
    depends_on:
      - corbel-backend
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  corbel_pgdata:
    name: corbel_pgdata
